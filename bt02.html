<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách ảnh của bạn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

      
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #111;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 280px); 
            gap: 15px;
        }

        .image-grid img {
            width: 100%;
            height: 280px;
            border-radius: 4px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Danh sách ảnh của bạn</h1>

    <div class="image-grid">
        <!-- Ảnh 1 -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRe6AoAadi2GlDu6nyHUx4pC3re3nEqYn0noQ_bLi2ZDg&s=10" alt="Ảnh cá nhân 1">
        
        <!-- Ảnh 2 -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyaX75c_JwDKp7o48tMHJ-8CMJn1h3-IeKDCGHJXJi4A&s=10" alt="Ảnh cá nhân 2">
        
        <!-- Ảnh 3 -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYnAsUTIcNQALHD5lM_LVhUNIJyCc2pQWfMkw6KSJ9rg&s=10" alt="Ảnh cá nhân 3">
        
        <!-- Ảnh 4 -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSm2zF0z-IaSrXjmyf70FC_6X43RB2jCEsPuDCkrDYeNQ&s=10" alt="Ảnh cá nhân 4">
    </div>

</body>
</html>
