<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form thông tin sở thích</title>
</head>
<body border="2">
<div class="form-box">
    <div class="form-title">SỞ THÍCH CỦA BẠN</div>
    <div class="form-content">
        <form>
            <div class="row">
                <label class="title-label">Họ và tên</label>
                <input type="text" name="fullname">
            </div>
            <div class="row">
                <label class="title-label">Email</label>
                <input type="email" name="email">
            </div>
            <div class="row" style="align-items: flex-start;">
                <label class="title-label">Sở thích</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby"> Thể thao</label>
                    <label><input type="checkbox" name="hobby"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby"> Lướt web</label>
                    <label><input type="checkbox" name="hobby"> Chơi game</label>
                    <label><input type="checkbox" name="hobby"> Điện ảnh</label>
                    <label><input type="checkbox" name="hobby"> Du lịch</label>
                </div>
            </div>
            <div class="buttons">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>
</div>
</body>
</html>
